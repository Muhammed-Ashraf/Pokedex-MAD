# protobuf-protoc  → com.google.protobuf:protoc
#   Build-time: the protoc compiler (Gradle runs it via protobuf { protoc { artifact = ... } }).
#
# protobuf-kotlin-lite → com.google.protobuf:protobuf-kotlin-lite
#   Compile/runtime: Kotlin protobuf "lite" support for generated code + your module.
#
# Same version.ref = "protobuf" so compiler + runtime stay on one Protobuf release (e.g. 4.31.x).
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }

