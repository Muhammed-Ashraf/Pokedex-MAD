# Protobuf / Proto DataStore — two different version lines on purpose:
#
# protobufPlugin (e.g. 0.9.x)
#   - Version of the GRADLE PLUGIN: id "com.google.protobuf"
#   - Wires Gradle to run protoc, compile src/main/proto/*.proto, generate Java/Kotlin (lite) sources.
#   - Released on its own schedule; NOT the same as protobuf runtime 4.x.
#
# protobuf (e.g. 4.31.x)
#   - Version of the Google Protobuf 4.x LINE used for DEPENDENCIES, typically:
#     - com.google.protobuf:protoc (compiler artifact in protobuf { protoc { ... } })
#     - com.google.protobuf:protobuf-kotlin-lite (runtime for lite-generated code)
#   - Keeps protoc + kotlin-lite aligned with generated code.
#
# You generally need BOTH: one for "how Gradle generates code", one for "which protoc + lite libs".
protobufPlugin = "0.9.5"
protobuf = "4.31.1"





